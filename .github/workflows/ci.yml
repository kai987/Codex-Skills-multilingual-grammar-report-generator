name: Core runtime checks

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm install --global npm@11.18.0
      - run: npm ci
      - run: npm run build
      - run: npm test
      - name: CLI smoke test (test data only, no model API)
        run: npm run grammar-report -- --text '日本語を勉強しています。' --analysis-provider mock --output output/ci-smoke
